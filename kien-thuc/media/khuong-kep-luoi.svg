<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" stroke-width="0.3" stroke-dasharray="none" fill="black" stroke="black" font-family="Arial, sans-serif" font-size="10pt" font-weight="normal" font-style="normal" width="900" height="350" viewBox="0 0 900 350"><title id="title">Lưới thời gian: đánh, giữ và nghỉ</title><desc id="desc">Ô1 phải C4 D4 E4 giữE4; trái C3 giữ giữ giữ. Ô2 phải nghỉ E4 D4 giữD4; trái C3 giữ G2 giữ. Nhả các nốt cuối ở số1 ô3.</desc><rect width="900" height="350" fill="#fffdf8" stroke="none"></rect><text fill="#292135" stroke="none" font-family="Arial" font-size="23pt" font-weight="bold" x="30" y="36">Lưới thời gian: đánh, giữ và nghỉ</text><text fill="#292135" stroke="none" font-family="Arial" font-size="18pt" x="170" y="78">Ô 1</text><text fill="#292135" stroke="none" font-family="Arial" font-size="18pt" x="555" y="78">Ô 2</text><text fill="#292135" stroke="none" font-family="Arial" font-size="17pt" x="28" y="118">Phách</text><text fill="#6437a0" stroke="none" font-family="Arial" font-size="17pt" x="28" y="183">Phải</text><text fill="#087b80" stroke="none" font-family="Arial" font-size="17pt" x="28" y="253">Trái</text><text fill="#292135" stroke="none" font-family="Arial" font-size="18pt" x="147" y="118">1</text><rect x="110" y="140" width="88" height="52" fill="#eee3fb" stroke="none"></rect><text fill="#6437a0" stroke="none" font-family="Arial" font-size="15pt" x="117" y="173">C4</text><rect x="110" y="210" width="88" height="52" fill="#e0f1ed" stroke="none"></rect><text fill="#087b80" stroke="none" font-family="Arial" font-size="15pt" x="117" y="243">C3</text><text fill="#292135" stroke="none" font-family="Arial" font-size="18pt" x="241" y="118">2</text><rect x="204" y="140" width="88" height="52" fill="#eee3fb" stroke="none"></rect><text fill="#6437a0" stroke="none" font-family="Arial" font-size="15pt" x="211" y="173">D4</text><rect x="204" y="210" width="88" height="52" fill="#e0f1ed" stroke="none"></rect><text