" y="118">3</text><rect x="674" y="140" width="88" height="52" fill="#eee3fb" stroke="none"></rect><text fill="#6437a0" stroke="none" font-family="Arial" font-size="15pt" x="681" y="173">D4</text><rect x="674" y="210" width="88" height="52" fill="#e0f1ed" stroke="none"></rect><text fill="#087b80" stroke="none" font-family="Arial" font-size="15pt" x="681" y="243">G2</text><text fill="#292135" stroke="none" font-family="Arial" font-size="18pt" x="805" y="118">4</text><rect x="768" y="140" width="88" height="52" fill="#eee3fb" stroke="none"></rect><text fill="#6437a0" stroke="none" font-family="Arial" font-size="15pt" x="775" y="173">Giữ D4</text><rect x="768" y="210" width="88" height="52" fill="#e0f1ed" stroke="none"></rect><text fill="#087b80" stroke="none" font-family="Arial" font-size="15pt" x="775" y="243">Giữ G2</text><path stroke-width="2" fill="none" stroke="#292135" d="M482 93L482 280"></path><text stroke-width="2" fill="#292135" stroke="none" font-family="Arial" font-size="17pt" x="30" y="322">Tới số 1 ô 3: nhả D4 và G2. Ô 2 bắt đầu bằng một tay chơi, một tay nghỉ.</text></svg>
