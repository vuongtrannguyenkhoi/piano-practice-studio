<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" stroke-width="0.3" stroke-dasharray="none" fill="black" stroke="black" font-family="Arial, sans-serif" font-size="10pt" font-weight="normal" font-style="normal" width="900" height="370" viewBox="0 0 900 370"><title id="title">Sau khi xem sheet: chọn bước học có lý do</title><desc id="desc">Học ngay nếu nhiệm vụ nền rõ và có mục tiêu mới cụ thể; học có hỗ trợ nếu gọi tên chỗ kẹt và bài chuẩn bị; để dành nếu nhiều lớp nền chưa biết.</desc><rect width="900" height="370" fill="#fffdf8" stroke="none"></rect><text fill="#292135" stroke="none" font-family="Arial" font-size="23pt" font-weight="bold" x="28" y="36">Sau khi xem sheet: chọn bước học có lý do</text><rect x="28" y="85" width="270" height="205" fill="#eee3fb" stroke="none"></rect><text fill="#6437a0" stroke="none" font-family="Arial" font-size="20pt" font-weight="bold" x="44" y="125">HỌC NGAY</text><text fill="#292135" stroke="none" font-family="Arial" font-size="18pt" x="44" y="175">Nền đã khá rõ</text><text fill="#292135" stroke="none" font-family="Arial" font-size="18pt" x="44" y="212">Một mục tiêu mới</text><text fill="#292135" stroke="none" font-family="Arial" font-size="18pt" x="44" y="249">Biết chỗ cần luyện</text><rect x="316" y="85" width="270" height="205" fill="#e0f1ed" stroke="none"></rect><text fill="#087b80" stroke="none" font-family="Arial" font-size="20pt" font-weight="bold" x="332" y="125">CÓ HỖ TRỢ</text><text fill="#292135" stroke="none" font-family="Arial" font-size="18pt" x="332" y="175">Gọi tên chỗ kẹt</text><text fill="#292135" stroke="none" font-family="Arial" font-size="18pt" x="332" y="212">Chọn bước chuẩn bị</text><text fill="#292135" stroke="none" font-family="Arial" font-size="18pt" x="332" y="249">Thử lại câu ngắn</text><rect x="604" y="85" width="270" height="205" fill="#eee3fb" stroke="none"></rect><text fill="#6437a0" stroke="none" font-family="Arial" font-size="20pt" font-weight="bold" x="620" y="125">ĐỂ DÀNH</text><text fill="#292135" stroke="none" font-family="Arial" font-size="18pt" x="620" y="175">Nhiều lớp còn mới</text><text fill="#292135" stroke="none" font-family="Arial" font-size="18pt" x="620" y="212">Tìm phiên bản khác</text><text fill="#292135" stroke="none" font-family="Arial" font-size="18pt" x="620" y="249">Giữ mục tiêu yêu thích</text><text fill="#292135" stroke="none" font-family="Arial" font-size="18pt" x="28" y="335">Không quyết định chỉ từ tên bài, chữ “easy” hoặc một lần vấp</text></svg>
