<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc"><title id="title">Hai vùng Đô–Sol, cách nhau một quãng tám</title><desc id="desc">Tay trái C3 đến G3 dùng 5 4 3 2 1. Tay phải C4 đến G4 dùng 1 2 3 4 5. C4 là Đô giữa.</desc><rect width="900" height="340" rx="20" fill="#fffdf8"/><g font-family="Arial, sans-serif" fill="#292135"><text x="42" y="42" font-size="25" font-weight="700">Tìm phím trước, rồi đọc số ngón</text><text x="42" y="77" fill="#087b80" font-size="19">TAY TRÁI · Đô thấp</text><text x="518" y="77" fill="#6437a0" font-size="19">TAY PHẢI · Đô giữa</text><rect x="42" y="95" width="68" height="180" rx="3" fill="#ddf2ef" stroke="#8d8398"/><text x="76" y="242" text-anchor="middle" font-size="19">C3</text><circle cx="76" cy="202" r="15" fill="#087b80"/><text x="76" y="208" text-anchor="middle" fill="#fff" font-size="17">5</text><rect x="110" y="95" width="68" height="180" rx="3" fill="#ddf2ef" stroke="#8d8398"/><text x="144" y="242" text-anchor="middle" font-size="19">D3</text><circle cx="144" cy="202" r="15" fill="#087b80"/><text x="144" y="208" text-anchor="middle" fill="#fff" font-size="17">4</text><rect x="178" y="95" width="68" height="180" rx="3" fill="#ddf2ef" stroke="#8d8398"/><text x="212" y="242" text-anchor="middle" font-size="19">E3</text><circle cx="212" cy="202" r="15" fill="#087b80"/><text x="212" y="208" text-anchor="middle" fill="#fff" font-size="17">3</text><rect x="246" y="95" width="68" height="180" rx="3" fill="#ddf2ef" stroke="#8d8398"/><text x="280" y="242" text-anchor="middle" font-size="19">F3</text><circle cx="280" cy="202" r="15" fill="#087b80"/><text x="280" y="208" text-anchor="middle" fill="#fff" font-size="17">2</text><rect x="314" y="95" width="68" height="180" rx="3" fill="#ddf2ef" stroke="#8d8398"/><text x="348" y="242" text-anchor="middle" font-size="19">G3</text><circle cx="348" cy="202" r="15" fill="#087b80"/><text x="348" y="208" text-anchor="middle" fill="#fff" font-size=