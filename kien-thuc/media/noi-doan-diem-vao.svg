<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" stroke-width="0.3" stroke-dasharray="none" fill="black" stroke="black" font-family="Arial, sans-serif" font-size="10pt" font-weight="normal" font-style="normal" width="900" height="470" viewBox="0 0 900 470"><title id="title">Vùng chồng và cách vào một nốt đang giữ</title><desc id="desc">A ô1–2, B ô2–3, C ô3–4. Ô3 phách1 E4/C3 bắt đầu; phách2 F4/giữC3. Ưu tiên lùi về phách1, không đánh lại C3 ở2.</desc><rect width="900" height="470" fill="#fffdf8" stroke="none"></rect><text fill="#292135" stroke="none" font-family="Arial" font-size="23pt" font-weight="bold" x="28" y="36">Vùng chồng và cách vào một nốt đang giữ</text><rect x="150" y="64" width="162" height="38" fill="#eee3fb" stroke="none"></rect><text fill="#292135" stroke="none" font-family="Arial" font-size="19pt" x="200" y="90">Ô 1</text><rect x="325" y="64" width="162" height="38" fill="#eee3fb" stroke="none"></rect><text fill="#292135" stroke="none" font-family="Arial" font-size="19pt" x="375" y="90">Ô 2</text><rect x="500" y="64" width="162" height="38" fill="#eee3fb" stroke="none"></rect><text fill="#292135" stroke="none" font-family="Arial" font-size="19pt" x="550" y="90">Ô 3</text><rect x="675" y="64" width="162" height="38" fill="#eee3fb" stroke="none"></rect><text fill="#292135" stroke="none" font-family="Arial" font-size="19pt" x="725" y="90">Ô 4</text><rect x="150" y="120" width="337" height="34" fill="#eee3fb" stroke="none"></rect><text fill="#292135" stroke="none" font-family="Arial" font-size="17pt" x="165" y="144">A · hai ô liên tiếp</text><rect x="325" y="170" width="337" height="34" fill="#e0f1ed" stroke="none"></rect><text fill="#292135" stroke="none" font-family="Arial" font-size="17pt" x="340" y="194">B · hai ô liên tiếp</text><rect x="500" y="220" width="337" height="34" fill="#eee3fb" stroke="none"></rect><text fill="#292135" stroke="none" font-family="Arial" font-size="17pt" x="515" y="244">C · hai ô liên tiếp</text><text fill="#6437a0" stroke="none" font-family="Arial" font-size="20pt" font-weight="bold" x="35" y="300">Ưu tiên: bắt đầu ô 3 phách 1</text><text fill="#292135" stroke="none" font-family="Arial" font-size="19pt" x="45" y="345">1: E4 / C3 mới đánh</text><text fill="#292135" stroke="none" font-family="Arial" font-size="24pt" x="370" y="345">→</text><text fill="#292135" stroke="none" font-family="Arial" font-size="19pt" x="430" y="345">2: F4 / giữ C3</text><text fill="#292135" stroke="none" font-family="Arial" font-size="18pt" x="35" y="399">Nếu dựng đoạn từ phách 2: đặt và giữ C3 trước khi vào F4.</text><text fill="#292135" stroke="none" font-family="Arial" font-size="18pt" x="35" y="435">Sau lượt tìm động tác, trở về phách 1 để kiểm câu thật.</text></svg>
