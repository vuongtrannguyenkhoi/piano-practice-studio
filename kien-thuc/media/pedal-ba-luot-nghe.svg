<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" stroke-width="0.3" stroke-dasharray="none" fill="black" stroke="black" font-family="Arial, sans-serif" font-size="10pt" font-weight="normal" font-style="normal" width="900" height="350" viewBox="0 0 900 350"><title id="title">Cùng hai ô, ba lượt nghe có mục tiêu khác nhau</title><desc id="desc">A không pedal nghe chỗ nối ngón; B pedal giữ xuyên C Dm nghe âm cũ chồng mới; C đổi sau Dm vào nghe hòa âm mới rõ,chỗ nối liền. Giữ nguyên nốt và nhịp.</desc><rect width="900" height="350" fill="#fffdf8" stroke="none"></rect><text fill="#292135" stroke="none" font-family="Arial" font-size="23pt" font-weight="bold" x="28" y="36">Cùng hai ô, ba lượt nghe có mục tiêu khác nhau</text><rect x="28" y="84" width="844" height="62" fill="#eee3fb" stroke="none"></rect><text fill="#6437a0" stroke="none" font-family="Arial" font-size="18pt" font-weight="bold" x="45" y="122">A · Không pedal</text><text fill="#292135" stroke="none" font-family="Arial" font-size="18pt" x="270" y="122">Nghe chỗ nối khi tay rời C sang Dm</text><rect x="28" y="157" width="844" height="62" fill="#eee3fb" stroke="none"></rect><text fill="#6437a0" stroke="none" font-family="Arial" font-size="18pt" font-weight="bold" x="45" y="195">B · Giữ suốt</text><text fill="#292135" stroke="none" font-family="Arial" font-size="18pt" x="270" y="195">Nghe âm C–E–G còn phủ lên D–F–A</text><rect x="28" y="230" width="844" height="62" fill="#e0f1ed" stroke="none"></rect><text fill="#087b80" stroke="none" font-family="Arial" font-size="18pt" font-weight="bold" x="45" y="268">C · Đổi pedal</text><text fill="#292135" stroke="none" font-family="Arial" font-size="18pt" x="270" y="268">Nghe Dm rõ, kiểm cả chỗ nối có hụt không</text><text fill="#292135" stroke="none" font-family="Arial" font-size="16pt" x="28" y="329">Cùng tempo, mức âm và thiết lập ghi · Không kết luận mọi chồng âm đều sai</text></svg>
