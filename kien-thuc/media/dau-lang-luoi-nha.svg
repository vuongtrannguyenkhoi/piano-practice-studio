<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" stroke-width="0.3" stroke-dasharray="none" fill="black" stroke="black" font-family="Arial, sans-serif" font-size="10pt" font-weight="normal" font-style="normal" width="900" height="360" viewBox="0 0 900 360"><title id="title">Đừng nhầm giữ nốt với nghỉ tiếng</title><desc id="desc">Tám phách: phải C4,nghỉ,E4,giữE4 / nghỉ,nghỉ,D4,E4. Trái C3 E3 G3 E3 mỗi ô. Nghỉ là nhả riêng tay phải,không dừng tay trái.</desc><rect width="900" height="360" fill="#fffdf8" stroke="none"></rect><text fill="#292135" stroke="none" font-family="Arial" font-size="23pt" x="28" y="36">Đừng nhầm giữ nốt với nghỉ tiếng</text><text fill="#292135" stroke="none" font-family="Arial" font-size="17pt" x="22" y="108">Phách</text><text fill="#292135" stroke="none" font-family="Arial" font-size="17pt" x="22" y="176">Phải</text><text fill="#292135" stroke="none" font-family="Arial" font-size="17pt" x="22" y="245">Trái</text><text fill="#292135" stroke="none" font-family="Arial" font-size="16pt" x="132" y="108">1:1</text><rect x="107" y="140" width="89" height="50" fill="#eee3fb" stroke="none"></rect><text fill="#6437a0" stroke="none" font-family="Arial" font-size="15pt" x="113" y="173">C4</text><rect x="107" y="209" width="89" height="50" fill="#e0f1ed" stroke="none"></rect><text fill="#087b80" stroke="none" font-family="Arial" font-size="16pt" x="131" y="242">C3</text><text fill="#292135" stroke="none" font-family="Arial" font-size="16pt" x="227" y="108">1:2</text><rect x="202" y="140" width="89" height="50" fill="#f0edf2" stroke="none"></rect><text fill="#6437a0" stroke="none" font-family="Arial" font-size="15pt" x="208" y="173">Nghỉ</text><rect x="202" y="209" width="89" height="50" fill="#e0f1ed" stroke="none"></rect><text fill="#087b80" stroke="none" font-family="Arial" font-size="16pt" x="226" y="242">E3</text><text fill="#292135" stroke="none" font-family="Arial" font-size="16pt" x="322" y="108">1:3</text><rect x="297" y="140" width="89" height="50" fill="#eee3fb" stroke="none"></rect><text fill="#6437a0" stroke="none" font-family="Arial" font-size="15pt" x="303" y="173">E4</text><rect x="297" y="209" width="89" height="50" fill="#e0f1ed" stroke="none"></rect><text fill="#087b80" stroke="none" font-family="Arial" font-size="16pt" x="321" y="242">G3</text><text fill="#292135" stroke="none" font-family="Arial" font-size="16pt" x="417" y="108">1:4</text><rect x="392" y="140" width="89" height="50" fill="#eee3fb" stroke="none"></rect><text fill="#6437a0" stroke="none" font-family="Arial" font-size="15pt" x="398" y="173">Giữ E4</text><rect x="392" y="209" width="89" height="50" fill="#e0f1ed" stroke="none"></rect><text fill="#087b80" stroke="none" font-family="Arial" font-size="16pt" x="416" y="242">E3</text><text fill="#292135" stroke="none" font-family="Arial" font-size="16pt" x="512" y="108">2:1</text><rect x="487" y="140" width="89" height="50" fill="#f0edf2" stroke="none"></rect><text fill="#6437a0" stroke="none" font-family="Arial" font-size="15pt" x="493" y="173">Nghỉ</text><rect x="487" y="209" width="89" height="50" fill="#e0f1ed" stroke="none"></rect><text fill="#087b80" stroke="none" font-family="Arial" font-size="16pt" x="511" y="242">C3</text><text fill="#292135" stroke="none" font-family="Arial" font-size="16pt" x="607" y="108">2:2</text><rect x="582" y="140" width="89" height="50" fill="#f0edf2" stroke="none"></rect><text fill="#6437a0" stroke="none" font-family="Arial" font-size="15pt" x="588" y="173">Nghỉ</text><rect x="582" y="209" width="89" height="50" fill="#e0f1ed" stroke="none"></rect><text fill="#087b80" stroke="none" font-family="Arial" font-size="16pt" x="606" y="242">E3</text><text fill="#292135" stroke="none" font-family="Arial" font-size="16pt" x="702" y="108">2:3</text><rect x="677" y="140" width="89" height="50" fill="#eee3fb" stroke="none"></rect><text fill="#6437a0" stroke="none" font-family="Arial" font-size="15pt" x="683" y="173">D4</text><rect x="677" y="209" width="89" height="50" fill="#e0f1ed" stroke="none"></rect><text fill="#087b80" stroke="none" font-family="Arial" font-size="16pt" x="701" y="242">G3</text><text fill="#292135" stroke="none" font-family="Arial" font-size="16pt" x="797" y="108">2:4</text><rect x="772" y="140" width="89" height="50" fill="#eee3fb" stroke="none"></rect><text fill="#6437a0" stroke="none" font-family="Arial" font-size="15pt" x="778" y="173">E4</text><rect x="772" y="209" width="89" height="50" fill="#e0f1ed" stroke="none"></rect><text fill="#087b80" stroke="none" font-family="Arial" font-size="16pt" x="796" y="242">E3</text><text fill="#292135" stroke="none" font-family="Arial" font-size="17pt" x="28" y="316">1:2 = ô 1, phách 2 · Không có tiếng mới không luôn có nghĩa là nghỉ</text></svg>
