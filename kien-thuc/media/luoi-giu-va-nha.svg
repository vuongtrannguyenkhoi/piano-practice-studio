<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc"><title id="title">Một lần vào tiếng, bốn phách giữ</title><desc id="desc">Tay trái đánh C3 ở phách 1, tiếp tục giữ ở phách 2 3 4, nhả khi đếm số 1 của ô kế. Tay phải đổi nốt từng phách.</desc><rect width="900" height="340" rx="20" fill="#fffdf8"/><g font-family="Arial, sans-serif" fill="#292135"><text x="40" y="43" font-size="25" font-weight="700">Đổi nốt bên phải, giữ phím bên trái</text><text x="235" y="92" text-anchor="middle" font-size="22">1</text><text x="370" y="92" text-anchor="middle" font-size="22">2</text><text x="505" y="92" text-anchor="middle" font-size="22">3</text><text x="640" y="92" text-anchor="middle" font-size="22">4</text><text x="775" y="92" text-anchor="middle" font-size="22">1 kế</text><text x="40" y="151" font-size="20" fill="#6437a0">Tay phải</text><text x="40" y="231" font-size="20" fill="#087b80">Tay trái</text><rect x="185" y="115" width="100" height="56" rx="10" fill="#6437a0"/><text x="235" y="151" fill="#fff" text-anchor="middle" font-size="20">C4</text><rect x="320" y="115" width="100" height="56" rx="10" fill="#6437a0"/><text x="370" y="151" fill="#fff" text-anchor="middle" font-size="20">E4</text><rect x="455" y="115" width="100" height="56" rx="10" fill="#6437a0"/><text x="505" y="151" fill="#fff" text-anchor="middle" font-size="20">D4</text><rect x="590" y="115" width="100" height="56" rx="10" fill="#6437a0"/><text x="640" y="151" fill="#fff" text-anchor="middle" font-size="20">E4</text><rect x="185" y="195" width="555" height="56" rx="10" fill="#087b80"/><text x="462" y="231" fill="#fff" text-anchor="middle" font-size="20">C3 — giữ liên tục, không đánh lại</text><path d="M775 185v76" stroke="#bc4b45" stroke-width="3"/><text x="790" y="231" fill="#bc4b45" font-size="18">Nhả</text><text x="40" y="304" font-size="18">Âm có thể nhỏ dần; nhìn phím để kiểm tra tay có nhả sớm hay không.</text></g></svg>
