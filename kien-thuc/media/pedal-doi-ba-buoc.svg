<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" stroke-width="0.3" stroke-dasharray="none" fill="black" stroke="black" font-family="Arial, sans-serif" font-size="10pt" font-weight="normal" font-style="normal" width="900" height="390" viewBox="0 0 900 390"><title id="title">Phóng to một điểm đổi: chơi mới → xóa cũ → bắt mới</title><desc id="desc">A tay đánh Dm khi pedal cũ còn xuống; B ngón giữ Dm,chân nhấc xóa C; C ngón giữ Dm,chân đạp lại bắt tiếng mới. Không phải ba phách mới.</desc><rect width="900" height="390" fill="#fffdf8" stroke="none"></rect><text fill="#292135" stroke="none" font-family="Arial" font-size="23pt" font-weight="bold" x="28" y="36">Phóng to một điểm đổi: chơi mới → xóa cũ → bắt mới</text><rect x="28" y="88" width="270" height="205" fill="#eee3fb" stroke="none"></rect><text fill="#6437a0" stroke="none" font-family="Arial" font-size="19pt" font-weight="bold" x="45" y="125">A · CHƠI MỚI</text><text fill="#292135" stroke="none" font-family="Arial" font-size="14pt" x="45" y="172">Tay</text><text fill="#292135" stroke="none" font-family="Arial" font-size="18pt" x="45" y="200">Đánh D3–F3–A3</text><text fill="#292135" stroke="none" font-family="Arial" font-size="14pt" x="45" y="238">Chân</text><text fill="#292135" stroke="none" font-family="Arial" font-size="17pt" x="45" y="266">Pedal cũ còn xuống</text><rect x="316" y="88" width="270" height="205" fill="#e0f1ed" stroke="none"></rect><text fill="#087b80" stroke="none" font-family="Arial" font-size="19pt" font-weight="bold" x="333" y="125">B · XÓA CŨ</text><text fill="#292135" stroke="none" font-family="Arial" font-size="14pt" x="333" y="172">Tay</text><text fill="#292135" stroke="none" font-family="Arial" font-size="18pt" x="333" y="200">Ngón vẫn giữ Dm</text><text fill="#292135" stroke="none" font-family="Arial" font-size="14pt" x="333" y="238">Chân</text><text fill="#292135" stroke="none" font-family="Arial" font-size="17pt" x="333" y="266">Nhấc pedal, xóa C</text><rect x="604" y="88" width="270" height="205" fill="#eee3fb" stroke="none"></rect><text fill="#6437a0" stroke="none" font-family="Arial" font-size="19pt" font-weight="bold" x="621" y="125">C · BẮT MỚI</text><text fill="#292135" stroke="none" font-family="Arial" font-size="14pt" x="621" y="172">Tay</text><text fill="#292135" stroke="none" font-family="Arial" font-size="18pt" x="621" y="200">Ngón vẫn giữ Dm</text><text fill="#292135" stroke="none" font-family="Arial" font-size="14pt" x="621" y="238">Chân</text><text fill="#292135" stroke="none" font-family="Arial" font-size="17pt" x="621" y="266">Đạp lại bắt Dm</text><text fill="#292135" stroke="none" font-family="Arial" font-size="18pt" x="28" y="332">Ba bước được kéo giãn để học, không cộng thành ba phách chờ</text><text fill="#292135" stroke="none" font-family="Arial" font-size="17pt" x="28" y="365">Đổi gọn sau tiếng mới · Giữ Dm bằng ngón trong lúc chân xóa âm cũ</text></svg>
