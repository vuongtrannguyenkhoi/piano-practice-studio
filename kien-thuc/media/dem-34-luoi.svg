<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" stroke-width="0.3" stroke-dasharray="none" fill="black" stroke="black" font-family="Arial, sans-serif" font-size="10pt" font-weight="normal" font-style="normal" width="900" height="350" viewBox="0 0 900 350"><title id="title">Qua vạch ô: 3 → 1, không có phách chờ</title><desc id="desc">Ô2: phải E4 giữE4 C4, trái C3 E3G3 E3G3. Ô3: phải F4 giữF4 C4,trái F3 A3C4 A3C4.</desc><rect width="900" height="350" fill="#fffdf8" stroke="none"></rect><text fill="#292135" stroke="none" font-family="Arial" font-size="23pt" font-weight="bold" x="28" y="36">Qua vạch ô: 3 → 1, không có phách chờ</text><text fill="#292135" stroke="none" font-family="Arial" font-size="18pt" x="145" y="80">Ô 2 · C</text><text fill="#292135" stroke="none" font-family="Arial" font-size="18pt" x="520" y="80">Ô 3 · F</text><text fill="#292135" stroke="none" font-family="Arial" font-size="17pt" x="25" y="120">Phách</text><text fill="#6437a0" stroke="none" font-family="Arial" font-size="17pt" x="25" y="184">Phải</text><text fill="#087b80" stroke="none" font-family="Arial" font-size="17pt" x="25" y="254">Trái</text><text fill="#292135" stroke="none" font-family="Arial" font-size="17pt" x="158" y="120">1</text><rect x="110" y="140" width="118" height="52" fill="#eee3fb" stroke="none"></rect><text fill="#6437a0" stroke="none" font-family="Arial" font-size="16pt" x="124" y="173">E4</text><rect x="110" y="210" width="118" height="52" fill="#e0f1ed" stroke="none"></rect><text fill="#087b80" stroke="none" font-family="Arial" font-size="16pt" x="124" y="243">C3</text><text fill="#292135" stroke="none" font-family="Arial" font-size="17pt" x="284" y="120">2</text><rect x="236" y="140" width="118" height="52" fill="#eee3fb" stroke="none"></rect><text fill="#6437a0" stroke="none" font-family="Arial" font-size="16pt" x="250" y="173">Giữ E4</text><rect x="236" y="210" width="118" height="52" fill="#e0f1ed" stroke="none"></rect><text fill="#087b8