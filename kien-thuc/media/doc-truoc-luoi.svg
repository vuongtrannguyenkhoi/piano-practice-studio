<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" stroke-width="0.3" stroke-dasharray="none" fill="black" stroke="black" font-family="Arial, sans-serif" font-size="10pt" font-weight="normal" font-style="normal" width="900" height="350" viewBox="0 0 900 350"><title id="title">Ô 1: đọc trước không có nghĩa là đánh sớm</title><desc id="desc">Bốn phách. Tiếng đàn C4 bắt đầu ở1,giữ qua2,E4 ở3,G4 ở4. Gợi ý nhìn E4 khi giữ C4 rồi nhận G4; thời điểm nhìn không bắt buộc cố định.</desc><rect width="900" height="350" fill="#fffdf8" stroke="none"></rect><text fill="#292135" stroke="none" font-family="Arial" font-size="23pt" font-weight="bold" x="28" y="36">Ô 1: đọc trước không có nghĩa là đánh sớm</text><text fill="#292135" stroke="none" font-family="Arial" font-size="17pt" x="28" y="99">Phách</text><text fill="#6437a0" stroke="none" font-family="Arial" font-size="17pt" x="28" y="161">Đàn</text><text fill="#087b80" stroke="none" font-family="Arial" font-size="17pt" x="28" y="236">Đọc</text><text fill="#292135" stroke="none" font-family="Arial" font-size="20pt" x="190" y="99">1</text><rect x="110" y="125" width="180" height="55" fill="#eee3fb" stroke="none"></rect><text fill="#6437a0" stroke="none" font-family="Arial" font-size="16pt" x="122" y="160">C4 bắt đầu</text><rect x="110" y="200" width="180" height="55" fill="#e0f1ed" stroke="none"></rect><text fill="#087b80" stroke="none" font-family="Arial" font-size="16pt" x="122" y="235">Biết C4</text><text fill="#292135" stroke="none" font-family="Arial" font-size="20pt" x="380" y="99">2</text><rect x="300" y="125" width="180" height="55" fill="#eee3fb" stroke="none"></rect><text fill="#6437a0" stroke="none" font-family="Arial" font-size="16pt" x="312" y="160">Giữ C4</text><rect x="300" y="200" width="180" height="55" fill="#e0f1ed" stroke="none"></rect><text fill="#087b80" stroke="none" font-family="Arial" font-size="16pt" x="312" y="235">Nhận E4 → 3</text><text fill="#292135" stroke="none" font-family="Arial" font-size="20pt" x="570" y="99">3</text><rect x="490" y="125" width="180" height="55" fill="#eee3fb" stroke="none"></rect><text fill="#6437a0" stroke="none" font-family="Arial" font-size="16pt" x="502" y="160">E4 bắt đầu</text><rect x="490" y="200" width="180" height="55" fill="#e0f1ed" stroke="none"></rect><text fill="#087b80" stroke="none" font-family="Arial" font-size="16pt" x="502" y="235">Nhận G4 → 4</text><text fill="#292135" stroke="none" font-family="Arial" font-size="20pt" x="760" y="99">4</text><rect x="680" y="125" width="180" height="55" fill="#eee3fb" stroke="none"></rect><text fill="#6437a0" stroke="none" font-family="Arial" font-size="16pt" x="692" y="160">G4 bắt đầu</text><rect x="680" y="200" width="180" height="55" fill="#e0f1ed" stroke="none"></rect><text fill="#087b80" stroke="none" font-family="Arial" font-size="16pt" x="692" y="235">Chuẩn bị F4</text><text fill="#292135" stroke="none" font-family="Arial" font-size="17pt" x="28" y="320">Hàng đọc là gợi ý tập · Hàng đàn phải giữ đúng thời gian trên sheet</text></svg>
