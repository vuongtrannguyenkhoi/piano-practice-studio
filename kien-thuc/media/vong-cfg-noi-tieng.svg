→</text><rect x="495" y="250" width="140" height="46" fill="#eee3fb" stroke="none"></rect><text fill="#292135" stroke="none" font-family="Arial" font-size="19pt" x="545" y="280">B3</text><text fill="#292135" stroke="none" font-family="Arial" font-size="23pt" x="650" y="280">→</text><rect x="695" y="250" width="140" height="46" fill="#eee3fb" stroke="none"></rect><text fill="#292135" stroke="none" font-family="Arial" font-size="19pt" x="745" y="280">C4</text><text fill="#292135" stroke="none" font-family="Arial" font-size="17pt" x="28" y="353">Cùng cao độ chưa có nghĩa giữ nối · Sheet yêu cầu đánh lại mỗi đầu ô</text></svg>
