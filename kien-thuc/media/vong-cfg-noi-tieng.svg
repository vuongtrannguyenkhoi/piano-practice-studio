<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" stroke-width="0.3" stroke-dasharray="none" fill="black" stroke="black" font-family="Arial, sans-serif" font-size="10pt" font-weight="normal" font-style="normal" width="900" height="380" viewBox="0 0 900 380"><title id="title">C → F/C → G/B → C: theo dõi từng tiếng</title><desc id="desc">Tiếng thấp C4 C4 B3 C4; giữa E4 F4 D4 E4; cao G4 A4 G4 G4. Đây là đường cao độ, không chỉ dẫn giữ phím liền.</desc><rect width="900" height="380" fill="#fffdf8" stroke="none"></rect><text fill="#292135" stroke="none" font-family="Arial" font-size="23pt" font-weight="bold" x="28" y="36">C → F/C → G/B → C: theo dõi từng tiếng</text><text fill="#6437a0" stroke="none" font-family="Arial" font-size="22pt" font-weight="bold" x="135" y="86">C</text><text fill="#6437a0" stroke="none" font-family="Arial" font-size="22pt" font-weight="bold" x="335" y="86">F/C</text><text fill="#6437a0" stroke="none" font-family="Arial" font-size="22pt" font-weight="bold" x="535" y="86">G/B</text><text fill="#6437a0" stroke="none" font-family="Arial" font-size="22pt" font-weight="bold" x="735" y="86">C</text><text fill="#292135" stroke="none" font-family="Arial" font-size="17pt" x="20" y="140">Cao</text><rect x="95" y="110" width="140" height="46" fill="#eee3fb" stroke="none"></rect><text fill="#292135" stroke="none" font-family="Arial" font-size="19pt" x="145" y="140">G4</text><text fill="#292135" stroke="none" font-family="Arial" font-size="23pt" x="250" y="140">→</text><rect x="295" y="110" width="140" height="46" fill="#eee3fb" stroke="none"></rect><text fill="#292135" stroke="none" font-family="Arial" font-size="19pt" x="345" y="140">A4</text><text fill="#292135" stroke="none" font-family="Arial" font-size="23pt" x="450" y="140">→</text><rect x="495" y="110" width="140" height="46" fill="#eee3fb" stroke="none"></rect><text fill="#292135" stroke="none" font-family="Arial" font-size="19pt" x="545" y="140">G4</text><text fill="#29